  <g font-size="22" fill="#101427">
    <rect x="60" y="190" width="300" height="90" rx="16" fill="#fff" stroke="#101427" stroke-width="2"/>
    <text x="210" y="230" text-anchor="middle" font-weight="700">Marketing site</text>
    <text x="210" y="260" text-anchor="middle" font-size="18">Next.js · landing · beta form</text>
    <rect x="450" y="190" width="300" height="90" rx="16" fill="#fff" stroke="#101427" stroke-width="2"/>
    <text x="600" y="230" text-anchor="middle" font-weight="700">Restaurant app</text>
    <text x="600" y="260" text-anchor="middle" font-size="18">Next.js · FR / AR (RTL)</text>
    <rect x="840" y="190" width="300" height="90" rx="16" fill="#fff" stroke="#101427" stroke-width="2"/>
    <text x="990" y="230" text-anchor="middle" font-weight="700">Back-office</text>
    <text x="990" y="260" text-anchor="middle" font-size="18">Accounts · access · support</text>
